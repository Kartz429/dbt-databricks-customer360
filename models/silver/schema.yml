version: 2

models:

  - name: silver_customers

    columns:

      - name: customer_id
        data_tests:
          - unique
          - not_null

      - name: email
        data_tests:
          - not_null

  - name: silver_orders

    columns:

      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null

          - relationships:
              arguments:
                to: ref('silver_customers')
                field: customer_id

      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Completed
                  - Returned
                  - Cancelled

      - name: order_amount
        data_tests:
          - generic_non_negative